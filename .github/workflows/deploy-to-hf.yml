name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create or update free Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          test -n "$HF_TOKEN"
          hf repos create shehrozjaved/ai-video-generator             --type space             --space-sdk static             --public             --exist-ok             --token "$HF_TOKEN"

      - name: Sync repository to Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: shehrozjaved/ai-video-generator
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
