name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create or update Gradio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          test -n "$HF_TOKEN"
          hf repos create shehrozjaved/ai-video-generator \
            --type space \
            --space-sdk gradio \
            --public \
            --exist-ok

      - name: Request ZeroGPU hardware
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "shehrozjaved/ai-video-generator"
          api = HfApi(token=os.environ["HF_TOKEN"])

          requested = False
          for flavor in ("zerogpu", "zero-a10g"):
              try:
                  runtime = api.request_space_hardware(repo_id, hardware=flavor)
                  print(f"requested_flavor={flavor}")
                  print(f"stage={runtime.stage}")
                  print(f"hardware={runtime.hardware}")
                  print(f"requested_hardware={runtime.requested_hardware}")
                  requested = True
                  break
              except Exception as exc:
                  print(f"ZeroGPU request attempt {flavor}: {type(exc).__name__}: {exc}")
          if not requested:
              print("No ZeroGPU hardware assignment accepted; production certification remains blocked until HF assigns GPU.")
          PY

      - name: Sync repository to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload shehrozjaved/ai-video-generator . \
            --repo-type space \
            --exclude=".git*" \
            --exclude=".github*" \
            --delete="*" \
            --commit-message="Sync from GitHub: ${{ github.sha }}"

      - name: Inspect Space runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf spaces info shehrozjaved/ai-video-generator \
            --expand=sdk,runtime
