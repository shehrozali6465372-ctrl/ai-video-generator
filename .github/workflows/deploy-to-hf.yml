name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create or update Gradio Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          test -n "$HF_TOKEN"
          hf repos create shehrozjaved/ai-video-generator             --type space             --space-sdk gradio             --public             --exist-ok             --token "$HF_TOKEN"

      - name: Request ZeroGPU hardware
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf spaces settings shehrozjaved/ai-video-generator             --hardware zero-a10g             --token "$HF_TOKEN"

      - name: Sync repository to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload shehrozjaved/ai-video-generator .             --repo-type space             --exclude=".git*"             --exclude=".github*"             --delete="*"             --commit-message="Sync from GitHub: ${{ github.sha }}"

      - name: Verify Space metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf spaces info shehrozjaved/ai-video-generator             --expand=sdk,runtime             --token "$HF_TOKEN"
