name: Test backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest
      - run: python -m compileall -q validation.py tests
      - name: Run tests\n        env:\n          PYTHONPATH: ${{ github.workspace }}\n        run: python -m pytest -q tests/test_validation.py -vv
